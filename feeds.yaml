# Planet Briefing — news sources.
#
# To add a source: copy one of the blocks below, change the name and url.
# Optional `region:` / `topic:` lines tell the free mode where a feed's
# stories usually belong (names must match config.yaml).
# To remove a source: delete its block, or set `enabled: false`.
#
# Only official public RSS/Atom feeds belong here. The site uses just the
# headline, short description and link each feed provides.
#
# Note on wire services: Reuters and AP no longer publish public RSS feeds,
# and AFP has no public English feed, so they can't be listed directly.
# France 24, Anadolu and others carry wire reporting in their own feeds.

feeds:
  # ---- Global / multi-region ----
  - name: "BBC News"
    url: "https://feeds.bbci.co.uk/news/world/rss.xml"
  - name: "Al Jazeera"
    url: "https://www.aljazeera.com/xml/rss/all.xml"
  - name: "DW"
    url: "https://rss.dw.com/xml/rss-en-world"
  - name: "France 24"
    url: "https://www.france24.com/en/rss"
  - name: "The Guardian"
    url: "https://www.theguardian.com/world/rss"
  - name: "Anadolu Agency"
    url: "https://www.aa.com.tr/en/rss/default?cat=guncel"

  # ---- Europe ----
  - name: "Euronews"
    url: "https://www.euronews.com/rss"
    region: "Europe"
  - name: "France 24"
    url: "https://www.france24.com/en/europe/rss"
    region: "Europe"
  - name: "BBC News"
    url: "https://feeds.bbci.co.uk/news/world/europe/rss.xml"
    region: "Europe"

